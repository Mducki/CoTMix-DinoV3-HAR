name: CI-CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/cotmix-dinov3-har

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài dependencies
        run: pip install -r requirements.txt flake8
      - name: Lint
        run: flake8 app.py algorithms.py kuhar_data.py --select=E9,F63,F7,F82 --show-source
      - name: Smoke test import
        run: python -c "import algorithms, kuhar_data; print('import OK')"
  
  docker-test:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (chưa push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: har-test:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy container và kiểm tra health
        run: |
          docker run -d --name har -p 8501:8501 har-test:ci
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8501/_stcore/health; then
              echo " -> App đã lên"; exit 0
            fi
            sleep 3
          done
          echo "App không lên được. Log container:"
          docker logs har
          exit 1

  build-and-push:
    needs: docker-test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max